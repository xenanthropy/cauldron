# Written by the Source Mage installer (enchantment install init systemd).
# Kernel messages on the console: only warnings and worse (as Debian does).
# systemd loads and unloads BPF programs, and each time the kernel logs an
# audit notice ("audit: type=1334 ... op=UNLOAD"), which would land on the
# console, over the login prompt. Everything still goes to the journal
# (journalctl -k). Remove this file to see all kernel messages again.
kernel.printk = 4 4 1 7
