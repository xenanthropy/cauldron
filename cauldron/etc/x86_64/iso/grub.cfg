# GRUB menu of the Source Mage install ISO (BIOS and UEFI).
# cauldron replaces @ISO_VERSION@ when it installs this file.

set default=0
set timeout=10

insmod all_video
insmod gfxterm

# kernel options some machines need, matched by their DMI product name
# (smbios type 1, string 5). Add machines here as they turn up.
set smgl_quirks=""
insmod smbios
if smbios --type 1 --get-string 5 --set smgl_product; then
  # Chuwi MiniBook X: the panel is mounted sideways and its firmware doesn't
  # say so; fbcon=rotate turns the console from the first line on, the video=
  # option tells the graphics stack (for desktops on the installed system)
  if [ "$smgl_product" = "MiniBook X" ]; then
    set smgl_quirks="fbcon=rotate:1 video=DSI-1:panel_orientation=right_side_up"
  fi
fi

# offer the menu on a serial port too, for headless machines and VMs
if serial --unit=0 --speed=115200; then
  terminal_input console serial
  terminal_output console serial
fi

menuentry "Source Mage GNU/Linux installer (@ISO_VERSION@)" {
  linux /boot/kernel console=ttyS0,115200 console=tty0 $smgl_quirks
  initrd /boot/initfs.gz
}

menuentry "Source Mage GNU/Linux installer, serial console" {
  linux /boot/kernel console=tty0 console=ttyS0,115200 $smgl_quirks
  initrd /boot/initfs.gz
}

menuentry "Source Mage GNU/Linux installer, choose boot device (menu)" {
  linux /boot/kernel console=ttyS0,115200 console=tty0 bootmenu $smgl_quirks
  initrd /boot/initfs.gz
}

if [ "$grub_platform" = "efi" ]; then
  menuentry "UEFI firmware settings" {
    fwsetup
  }
fi
