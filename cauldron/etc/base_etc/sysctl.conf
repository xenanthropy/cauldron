# /etc/sysctl.conf: kernel settings applied at boot (SMGL's smgl-sysctl runs
# "sysctl -p"); "man sysctl.conf", "sysctl -a" lists them all.

# Let every user ping without a setuid ping (ICMP datagram sockets); the
# default "1 0" allows nobody. Same as Fedora/systemd.
net.ipv4.ping_group_range = 0 2147483647
