# /etc/sysctl.conf: kernel settings applied at boot (SMGL's smgl-sysctl runs
# "sysctl -p"); "man sysctl.conf", "sysctl -a" lists them all.

# Let every user ping without a setuid ping (ICMP datagram sockets); the
# default "1 0" allows nobody. Same as Fedora/systemd.
net.ipv4.ping_group_range = 0 2147483647

# User namespaces let a program run as "root" inside a sandbox of its own
# without real root rights. Web browsers' sandboxes (Firefox, Chromium),
# bubblewrap/Flatpak and rootless containers depend on them, and systemd
# requires them. Their code has also been the way in for kernel security bugs
# that let a local user become root. On (the kernel's default) unless the line
# below is uncommented; with it, nobody can create one (root included), which
# breaks the programs above. Don't uncomment it on a systemd system.
#user.max_user_namespaces = 0
