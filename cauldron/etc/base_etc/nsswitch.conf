#
# /etc/nsswitch.conf: where the C library looks things up ("man 5
# nsswitch.conf"). "files" are the local files in /etc, "dns" the name
# servers in /etc/resolv.conf. (The old default also named NIS/NIS+, whose
# modules glibc no longer ships.)
#

passwd:     files
group:      files
shadow:     files

hosts:      files dns
networks:   files

protocols:  files
services:   files
ethers:     files
rpc:        files

netgroup:   files
