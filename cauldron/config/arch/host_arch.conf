#!/bin/bash

# contains the arch info for the HOST
CAULDRON_HOST_TRIPLE="${CAULDRON_HOST_TRIPLE:-}"

CAULDRON_HOST_CACHE_PATH="${CAULDRON_HOST_CACHE_PATH:-/var/cache/sorcery}"

# query the host sorcery config for a value by sourcing it (plus the local
# config, which is where ARCHITECTURE is normally set) in a subshell, since the
# config values are written as parameter expansions with defaults and can't be
# reliably grepped
function cauldron_host_sorcery_value() {
  (
    . "$CAULDRON_HSORCERY_CONFIG" &> "${CAULDRON_NULL:-/dev/null}"
    [[ -f "$CAULDRON_HSORCERY_LCONFIG" ]] &&
      . "$CAULDRON_HSORCERY_LCONFIG" &> "${CAULDRON_NULL:-/dev/null}"
    eval echo "\$$1"
  )
}

: "${CAULDRON_HOST_ARCH_PATH:=$(cauldron_host_sorcery_value ARCH_SPECS)}"
: "${CAULDRON_HOST_ARCH:=$(cauldron_host_sorcery_value ARCHITECTURE)}"
: "${CAULDRON_CACHE_EXTENSION:=$(cauldron_host_sorcery_value EXTENSION)}"


