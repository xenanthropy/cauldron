#!/bin/bash

# path where the installable system chroot is generated
: "${CAULDRON_SYS:=$CAULDRON_TMP/sys}"

# init system for the installable system, added to the sys spells: an INIT
# provider from the grimoire (simpleinit-msb, systemd, openrc, ...) or "none".
# simpleinit-msb is the default since it's what sorcery's init script support
# targets; other inits are untested so far.
: "${CAULDRON_SYS_INIT:=simpleinit-msb}"

# file listing all the spells to compose the SYS runtime
: "${CAULDRON_SYS_SPELLS:=$CAULDRON_CONFIG/$CAULDRON_ARCH/sys/sys.runtime}"
# file listing all the sources to supply in the SYS runtime
: "${CAULDRON_SYS_SOURCES:=$CAULDRON_CONFIG/$CAULDRON_ARCH/sys/sys.sources}"
# file listing all the spell caches to supply in the SYS runtime
: "${CAULDRON_SYS_CACHES:=$CAULDRON_CONFIG/$CAULDRON_ARCH/sys/sys.install}"

# base filename (i.e., without any suffixes) of the compressed system archive
# that goes into the base of the iso filesystem for base installation
: "${CAULDRON_SYS_NAME:=system}"

# full filename (including all suffixes) of the compressed system archive
# that goes into the base of the iso filesystem for base installation
: "${CAULDRON_SYS_NAME_FULL:=${CAULDRON_SYS_NAME}.tar.xz}"

# whether "cauldron sys package" also produces a release copy of the system
# archive, named like the official basesystem tarballs, with a .sha512 file
# (and a detached .sig if CAULDRON_SYS_SIGN_KEY is set)
: "${CAULDRON_SYS_RELEASE:=yes}"

# file name of the release copy (without path); if empty it is generated at
# package time as
# smgl-<grimoire>-<grimoire version>-<YYYYmmdd_HHMM>-basesystem-<arch>.tar.xz
# (with "-<init>" after "basesystem" when CAULDRON_SYS_INIT isn't the default)
: "${CAULDRON_SYS_RELEASE_NAME:=}"

# gpg key (id or fingerprint) used to sign the release copy; empty disables
# signing
: "${CAULDRON_SYS_SIGN_KEY:=}"
