#!/bin/bash

# path where the installable system chroot is generated
: "${CAULDRON_SYS:=$CAULDRON_TMP/sys}"

# init system for the installable system, added to the sys spells: an INIT
# provider from the grimoire (simpleinit-msb, systemd, openrc, ...) or "none".
# simpleinit-msb is the default since it's what sorcery's init script support
# targets; other inits are untested so far.
: "${CAULDRON_SYS_INIT:=simpleinit-msb}"

# system logger for the installable system, added to the sys spells: a
# SYSTEM-LOGGER provider (metalog, sysklogd, rsyslog, syslog-ng) or "none".
# Without one, daemons (nscd, sshd, dhcpcd, ...) write their messages to the
# console, over the login prompt, and nothing ends up in /var/log. systemd
# brings its own (journald), so with it the default is "none".
if [[ "$CAULDRON_SYS_INIT" == "systemd" ]]
then
  : "${CAULDRON_SYS_LOGGER:=none}"
else
  : "${CAULDRON_SYS_LOGGER:=metalog}"
fi

# file listing all the spells to compose the SYS runtime
: "${CAULDRON_SYS_SPELLS:=$CAULDRON_CONFIG/$CAULDRON_ARCH/sys/sys.runtime}"
# file listing all the sources to supply in the SYS runtime
: "${CAULDRON_SYS_SOURCES:=$CAULDRON_CONFIG/$CAULDRON_ARCH/sys/sys.sources}"
# file listing all the spell caches to supply in the SYS runtime
: "${CAULDRON_SYS_CACHES:=$CAULDRON_CONFIG/$CAULDRON_ARCH/sys/sys.install}"

# base filename (i.e., without any suffixes) of the compressed system archive
# that goes into the base of the iso filesystem for base installation
: "${CAULDRON_SYS_NAME:=system}"

# full filename (including all suffixes) of the compressed system archive
# that goes into the base of the iso filesystem for base installation
: "${CAULDRON_SYS_NAME_FULL:=${CAULDRON_SYS_NAME}.tar.xz}"

# whether "cauldron sys package" also produces a release copy of the system
# archive, named like the official basesystem tarballs, with a .sha512 file
# (and a detached .sig if CAULDRON_SYS_SIGN_KEY is set)
: "${CAULDRON_SYS_RELEASE:=yes}"

# file name of the release copy (without path); if empty it is generated at
# package time as
# smgl-<grimoire>-<grimoire version>-<YYYYmmdd_HHMM>-basesystem-<arch>.tar.xz
# (with "-<init>" after "basesystem" when CAULDRON_SYS_INIT isn't the default)
: "${CAULDRON_SYS_RELEASE_NAME:=}"

# gpg key (id or fingerprint) used to sign the release copy; empty disables
# signing
: "${CAULDRON_SYS_SIGN_KEY:=}"

# sorcery settings for the system tarball (VAR="value" lines, appended to its
# /etc/sorcery/local/config after ARCHITECTURE). Without SORCERY_BRANCH,
# sorcery's default is "stable", and the first `sorcery update` would replace
# the sorcery we install with sorcery-stable.tar.bz2 from 2016; the official
# tarballs use devel. Signature checks are on in the official tarballs too
# (the keys ship in /usr/share/smgl-pubkeys; both verify, Nov 2026).
# The rest are the official tarball's choices (maintainer, Nov 2026): a
# spell's init script installed and enabled by default (on an OpenRC system
# sorcery skips them, as /etc/init.d/runlevels is gone), autoprune, and
# questions that wait a day. Those use ${VAR:-...}, as the official tarball
# does: sorcery reads this file after the environment, and the installer
# runs its casts with PROMPT_DELAY=0, which a plain assignment would undo
[[ -n "$CAULDRON_SYS_SORCERY_CONFIG" ]] ||
  CAULDRON_SYS_SORCERY_CONFIG=(
    'SORCERY_BRANCH="devel"'
    'GPG_VERIFY_SORCERY="on"'
    'GPG_VERIFY_GRIMOIRE="on"'
    'DEF_INSTALL_INIT="${DEF_INSTALL_INIT:-on}"'
    'DEF_ENABLE_INIT="${DEF_ENABLE_INIT:-on}"'
    'AUTOPRUNE="${AUTOPRUNE:-on}"'
    'PROMPT_DELAY="${PROMPT_DELAY:-86400}"'
  )

# spells exiled in the system tarball (sorcery won't cast them). basesystem:
# sorcery's update_sorcery_scripts casts it whenever it isn't installed, and
# it conflicts with smgl-base, so every `sorcery update` asked "Dispel
# smgl-base?" (see CLAUDE.md, the sorcery bug)
[[ -n "$CAULDRON_SYS_EXILE" ]] ||
  CAULDRON_SYS_EXILE=(
    basesystem
  )
